name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: library_db
          MYSQL_USER: ${{ vars.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # API
      SPRING_APPLICATION_NAME: library-api
      APP_VERSION: "1.1.0"
      APP_DEVELOPER: "Jabier Zurro Aduriz"
      SERVER_PORT: "8080"

      # MySQL
      SPRING_DATASOURCE_URL: ${{ vars.DB_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_ENCODING: UTF-8

      # JPA / Hibernate
      SPRING_JPA_HIBERNATE_DDLAUTO: validate
      SPRING_JPA_OPENINVIEW: "false"

      # Kafka
      SPRING_KAFKA_BOOTSTRAPSERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
      SPRING_KAFKA_PRODUCER_KEYSERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUESERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer

      # JWT
      SECURITY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SECURITY_JWT_SECRET_FORMAT: HEX
      SECURITY_JWT_ISSUER: libraryapi
      SECURITY_JWT_EXPIRATION: "1800000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --errors clean verify