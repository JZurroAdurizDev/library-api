name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: library_db
          MYSQL_USER: library_user
          MYSQL_PASSWORD: library_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/library_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "library_user"
      SPRING_DATASOURCE_PASSWORD: "library_password"

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"

      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"

      SECURITY_JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SECURITY_JWT_SECRET_FORMAT: "HEX"
      SECURITY_JWT_ISSUER: "libraryapi"
      SECURITY_JWT_EXPIRATION: "1800000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --errors clean verify